# Vehicle Manager Service
#
# Das Backend wird per Profil gewaehlt, es laeuft immer nur eines (beide auf Port 8080):
#
#   docker compose --profile java up -d --build     Java / Spring Boot (java/)
#   docker compose --profile php  up -d --build     PHP / Symfony (php/)
#
# Alternativ ueber die Umgebungsvariable: COMPOSE_PROFILES=php docker compose up -d --build
#
# Beide Profile starten jeweils Datenbank, Backend und Frontend (http://localhost:5173).
# Das Frontend spricht das Backend ueber den gemeinsamen Netzwerk-Alias "backend" an.
#
# Nur die Datenbank fuer die lokale Java-Entwicklung (./mvnw spring-boot:run):
#   docker compose up -d postgres-java
name: vehicle-manager

services:
  # ---------------------------------------------------------------- Java ---
  postgres-java:
    image: postgres:17
    profiles: ["java"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      - "5432:5432"
    volumes:
      - postgres_java_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend-java:
    build: ./java
    profiles: ["java"]
    restart: unless-stopped
    environment:
      # Ueberschreibt spring.datasource.url aus application.properties (dort localhost)
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-java:5432/postgres?currentSchema=vehicle_manager
    ports:
      - "8080:8080"
    networks:
      default:
        aliases: [backend]
    depends_on:
      postgres-java:
        condition: service_healthy

  # ----------------------------------------------------------------- PHP ---
  postgres-php:
    image: postgres:17
    profiles: ["php"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: vehicle_manager
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: admin
    ports:
      # 5433, damit sie sich nicht mit einer lokal laufenden Java-Datenbank ins Gehege kommt
      - "5433:5432"
    volumes:
      - postgres_php_data:/var/lib/postgresql/data
      - ./php/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro,z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d vehicle_manager"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend-php:
    build: ./php
    profiles: ["php"]
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:admin@postgres-php:5432/vehicle_manager?serverVersion=17&charset=utf8
    ports:
      - "8080:8080"
    volumes:
      # Quellcode gemountet: Aenderungen wirken ohne Neubau
      - ./php:/app:z
    networks:
      default:
        aliases: [backend]
    depends_on:
      postgres-php:
        condition: service_healthy

  # ------------------------------------------------------------ Frontend ---
  frontend:
    image: node:22-alpine
    profiles: ["java", "php"]
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://backend:8080
    volumes:
      - ./frontend:/app:z
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"

volumes:
  postgres_java_data:
  postgres_php_data:
  frontend_node_modules:
